name: Sync Instagram Feed

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Rebuild and verify the public site even if the gallery is unchanged'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: miko-instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify sync behavior
        run: python3 -m unittest discover -s tests -v

      - name: Sync official Instagram feed
        id: sync
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_TOKEN_KEY: ${{ secrets.INSTAGRAM_TOKEN_KEY }}
        run: python3 sync_instagram.py

      - name: Save feed and encrypted renewal
        if: ${{ always() && steps.sync.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data/instagram.json data/ig_images/
          if [ -f .github/instagram-token.json ]; then
            git add -- .github/instagram-token.json
          fi
          if ! git diff --staged --quiet; then
            git commit -m 'Sync Instagram gallery and encrypted access state'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
            done
            echo 'Could not save sync state; manual review required.' >&2
            exit 1
          fi

      - name: Publish and verify public gallery
        if: ${{ success() && steps.sync.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}
        run: python3 publish_instagram.py
